[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Canonical host: send the old netlify.app address to the real domain so
# every client-facing link and QR code lives on halo.finessemedia.pro.
# (Only fires for the netlify.app host, so no loop on the custom domain.)
[[redirects]]
  from = "https://halo-frame.netlify.app/*"
  to = "https://halo.finessemedia.pro/:splat"
  status = 301
  force = true

# The app is product-only. The bare root is not a marketing page —
# bounce it to the real landing site at the EDGE (server-side 301),
# before any HTML or React loads, so a visitor to the bare URL never
# sees the app shell or the raw netlify.app address flash. Only the
# exact root is caught here; real app routes (/e, /g, /live, /admin,
# /legal) fall through to the SPA below, and any stray non-route URL
# is caught invisibly by the inline redirect in index.html <head>
# before React mounts — so no netlify URL is ever shown.
[[redirects]]
  from = "/"
  to = "https://get.finessemedia.pro"
  status = 301
  force = true

# SPA fallback so React Router handles all the real app routes
# (/e/:code, /g/:id, /live/:code, /admin, /legal). Static files at the
# build root (favicon, og-image, assets) and the Netlify functions are
# served before this rule, so they are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
