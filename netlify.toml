[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Canonical host: send the old netlify.app address to the real domain so
# every client-facing link and QR code lives on halo.finessemedia.pro.
# (Only fires for the netlify.app host, so no loop on the custom domain.)
[[redirects]]
  from = "https://halo-frame.netlify.app/*"
  to = "https://halo.finessemedia.pro/:splat"
  status = 301
  force = true

# The marketing/landing page and the app now live on one domain
# (halo.finessemedia.pro). The site root serves the static landing page;
# the React app owns only its real routes; anything else shows the landing
# page. No external redirect, so no netlify.app URL is ever shown.

# Root -> the static marketing page (rewrite, status 200, so the URL stays
# halo.finessemedia.pro/ with no redirect hop). force = true is REQUIRED:
# Vite builds a dist/index.html, so a real file exists at "/", and Netlify
# serves an existing file before applying a non-forced rule. Forcing makes
# the rewrite win so the root shows the landing page, not the app shell.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# Real app routes load the React SPA. Static files at the build root
# (favicon, og-image, /landing/* assets) and the Netlify functions
# (/.netlify/functions/*) are served before these rules, so they are
# unaffected.
[[redirects]]
  from = "/e/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/g/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/live/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/legal"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/reset"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/reset-confirm"
  to = "/index.html"
  status = 200

# Anything else is not an app route -> show the marketing page (not the
# app shell). Keeps every stray URL on-brand with no netlify address.
[[redirects]]
  from = "/*"
  to = "/landing.html"
  status = 200
